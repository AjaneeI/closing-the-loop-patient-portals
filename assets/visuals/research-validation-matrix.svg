<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Research validation matrix</title>
  <desc id="desc">Five patient portal pain points rated by evidence strength with the resulting evidence-aware framing.</desc>
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="55" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173b57">Research validation matrix</text>
  <text x="55" y="86" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Evidence supports the workflow problem, with different confidence levels across the five starting observations</text>
  <rect x="55" y="118" width="1090" height="54" rx="10" fill="#173b57"/>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><text x="80" y="151">Pain point</text><text x="465" y="151">Confidence</text><text x="660" y="151">Evidence-aware framing</text></g>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="182" width="1090" height="78" rx="8" fill="#fff" stroke="#d5dee8"/><text x="80" y="214" font-size="17" font-weight="700" fill="#173b57">Scheduling and cancellation</text><text x="80" y="239" font-size="14" fill="#64748b">Self-service availability and access</text><rect x="445" y="200" width="136" height="36" rx="18" fill="#dff4eb"/><text x="513" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#13735f">Strong</text><text x="660" y="214" font-size="15" fill="#173b57">Tools improve convenience and efficiency, but eligibility,</text><text x="660" y="237" font-size="15" fill="#173b57">uptake, and equity vary by workflow and population.</text>
    <rect x="55" y="270" width="1090" height="78" rx="8" fill="#f8fafc" stroke="#d5dee8"/><text x="80" y="302" font-size="17" font-weight="700" fill="#173b57">Outside medical records</text><text x="80" y="327" font-size="14" fill="#64748b">Receipt, matching, review, incorporation</text><rect x="420" y="288" width="186" height="36" rx="18" fill="#e8f2fb"/><text x="513" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#245f8f">Moderate to strong</text><text x="660" y="302" font-size="15" fill="#173b57">Exchange has improved, but information is not always complete,</text><text x="660" y="325" font-size="15" fill="#173b57">incorporated, or used at the point of care.</text>
    <rect x="55" y="358" width="1090" height="78" rx="8" fill="#fff" stroke="#d5dee8"/><text x="80" y="390" font-size="17" font-weight="700" fill="#173b57">Visit documents and notes</text><text x="80" y="415" font-size="14" fill="#64748b">Access versus understanding</text><rect x="445" y="376" width="136" height="36" rx="18" fill="#fff2d8"/><text x="513" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6508">Moderate</text><text x="660" y="390" font-size="15" fill="#173b57">Access has expanded; timing, document type, usability,</text><text x="660" y="413" font-size="15" fill="#173b57">and comprehension can still vary.</text>
    <rect x="55" y="446" width="1090" height="78" rx="8" fill="#f8fafc" stroke="#d5dee8"/><text x="80" y="478" font-size="17" font-weight="700" fill="#173b57">Preparation instructions</text><text x="80" y="503" font-size="14" fill="#64748b">Discoverability and task clarity</text><rect x="445" y="464" width="136" height="36" rx="18" fill="#fff2d8"/><text x="513" y="487" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6508">Moderate</text><text x="660" y="478" font-size="15" fill="#173b57">Structured tasks are feasible; direct comparative evidence</text><text x="660" y="501" font-size="15" fill="#173b57">about discoverability across configurations is limited.</text>
    <rect x="55" y="534" width="1090" height="78" rx="8" fill="#fff" stroke="#d5dee8"/><text x="80" y="566" font-size="17" font-weight="700" fill="#173b57">After-care expectations</text><text x="80" y="591" font-size="14" fill="#64748b">Communication need and AI risk</text><rect x="426" y="552" width="174" height="36" rx="18" fill="#e9e0f7"/><text x="513" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="#69459a">Strong need</text><text x="660" y="566" font-size="15" fill="#173b57">Plain-language summaries may help, but generated clinical text</text><text x="660" y="589" font-size="15" fill="#173b57">requires strict controls for hallucination and omission.</text>
  </g>
  <text x="55" y="646" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Method: focused secondary synthesis of government, peer-reviewed, and official product sources; not a systematic review.</text>
</svg>
