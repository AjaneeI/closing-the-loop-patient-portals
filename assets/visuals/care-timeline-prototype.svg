<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Care Timeline prototype</title>
  <desc id="desc">A patient portal mockup showing preparation, outside record review, visit documentation, and follow-up tasks in one timeline.</desc>
  <rect width="1200" height="675" fill="#f4f7fb"/>
  <rect x="45" y="34" width="1110" height="607" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="45" y="34" width="1110" height="78" rx="22" fill="#173b57"/>
  <rect x="45" y="90" width="1110" height="22" fill="#173b57"/>
  <circle cx="88" cy="73" r="18" fill="#7dd3c7"/>
  <path d="M80 73h16M88 65v16" stroke="#173b57" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="82" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Care Timeline</text>
  <text x="1090" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#dbeafe">Patient portal concept</text>
  <text x="82" y="156" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173b57">Upcoming care episode</text>
  <text x="82" y="184" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Everything needed before and after your outpatient visit</text>
  <rect x="82" y="208" width="1036" height="78" rx="14" fill="#eaf7f4" stroke="#8bcfc3"/>
  <circle cx="121" cy="247" r="20" fill="#13866f"/>
  <path d="M112 247l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="157" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b57">Appointment confirmed</text>
  <text x="157" y="265" font-family="Arial, sans-serif" font-size="15" fill="#475569">Monday, August 17 · 10:30 AM · Outpatient clinic</text>
  <rect x="918" y="228" width="168" height="38" rx="19" fill="#ffffff" stroke="#13866f"/>
  <text x="1002" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#13866f">Ready</text>
  <line x1="121" y1="286" x2="121" y2="549" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="121" cy="345" r="20" fill="#d97706"/>
  <text x="121" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">!</text>
  <text x="157" y="338" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b57">Complete preparation checklist</text>
  <text x="157" y="363" font-family="Arial, sans-serif" font-size="15" fill="#475569">2 of 3 provider-approved items complete · Due August 16</text>
  <rect x="918" y="322" width="168" height="38" rx="19" fill="#fff7ed" stroke="#d97706"/>
  <text x="1002" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b45309">Action needed</text>
  <circle cx="121" cy="432" r="20" fill="#2563a6"/>
  <path d="M111 432h20M121 422v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="157" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b57">Outside record received</text>
  <text x="157" y="450" font-family="Arial, sans-serif" font-size="15" fill="#475569">Submitted August 8 · Health information team is reviewing</text>
  <rect x="918" y="409" width="168" height="38" rx="19" fill="#eff6ff" stroke="#2563a6"/>
  <text x="1002" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4f7a">Waiting on care team</text>
  <circle cx="121" cy="519" r="20" fill="#94a3b8"/>
  <path d="M112 519h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="157" y="512" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b57">After-visit summary and follow-up</text>
  <text x="157" y="537" font-family="Arial, sans-serif" font-size="15" fill="#475569">Available after the care team documents your visit</text>
  <rect x="918" y="496" width="168" height="38" rx="19" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1002" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">Not available yet</text>
  <rect x="82" y="577" width="1036" height="42" rx="10" fill="#f1f5f9"/>
  <text x="102" y="603" font-family="Arial, sans-serif" font-size="14" fill="#475569">Every item shows its source, owner, status, and next action. Missing clinical guidance is never generated.</text>
</svg>
