<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MVP scope and release path</title>
  <desc id="desc">A three-phase roadmap beginning with a deterministic timeline, then adding source-linked AI explanation, then expanding workflows.</desc>
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173b57">MVP scope and release path</text>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Prove workflow coherence first; add constrained AI only after the deterministic experience is safe</text>
  <line x1="150" y1="202" x2="1050" y2="202" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="202" r="28" fill="#173b57"/><text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
  <circle cx="600" cy="202" r="28" fill="#d97706"/><text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">2</text>
  <circle cx="1000" cy="202" r="28" fill="#7c5bb0"/><text x="1000" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">3</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="260" width="360" height="310" rx="18" fill="#eaf7f4" stroke="#6ab7a8" stroke-width="2"/>
    <text x="88" y="301" font-size="21" font-weight="700" fill="#173b57">Deterministic timeline</text>
    <text x="88" y="330" font-size="15" fill="#475569">Initial MVP</text>
    <g font-size="16" fill="#173b57"><text x="90" y="377">• Unified episode timeline</text><text x="90" y="413">• Explicit state, owner, and due date</text><text x="90" y="449">• Preparation and follow-up tasks</text><text x="90" y="485">• Outside-record review tracking</text><text x="90" y="521">• Human escalation paths</text></g>
    <rect x="420" y="260" width="360" height="310" rx="18" fill="#fff6e8" stroke="#d7a94f" stroke-width="2"/>
    <text x="448" y="301" font-size="21" font-weight="700" fill="#173b57">Source-linked explanation</text>
    <text x="448" y="330" font-size="15" fill="#475569">After deterministic guardrails pass</text>
    <g font-size="16" fill="#173b57"><text x="450" y="377">• Optional plain-language view</text><text x="450" y="413">• Sentence-level source links</text><text x="450" y="449">• Grounding and safety validation</text><text x="450" y="485">• Patient-reviewed question drafts</text><text x="450" y="521">• Stratified human audits</text></g>
    <rect x="780" y="260" width="360" height="310" rx="18" fill="#f4efff" stroke="#9d81c9" stroke-width="2"/>
    <text x="808" y="301" font-size="21" font-weight="700" fill="#173b57">Broader workflows</text>
    <text x="808" y="330" font-size="15" fill="#475569">Only after pilot evidence</text>
    <g font-size="16" fill="#173b57"><text x="810" y="377">• Additional specialties</text><text x="810" y="413">• More task and document types</text><text x="810" y="449">• Proxy and caregiver workflows</text><text x="810" y="485">• Validated language expansion</text><text x="810" y="521">• Cross-episode prioritization</text></g>
  </g>
  <rect x="60" y="603" width="1080" height="42" rx="10" fill="#e8edf3"/>
  <text x="600" y="629" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Release gates: clinical safety · equity · privacy · accessibility · staff workload</text>
</svg>
